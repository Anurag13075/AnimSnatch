<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimSnatch</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <span class="logo-text">AnimSnatch</span>
      </div>
      <button class="icon-btn" id="settings-btn" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </header>

    <main class="main-content">
      <div class="modes-section">
        <p class="description">Select an extraction mode below, then click any element on the page.</p>
        
        <div class="action-grid" style="grid-template-columns: 1fr 1fr;">
          <button class="mode-card" data-mode="component">
            <div class="mode-icon bg-indigo-50 text-indigo-600">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#635bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            </div>
            <div class="mode-text">
              <span class="mode-title">Full Component</span>
              <span class="mode-desc">Clone UI & styling</span>
            </div>
          </button>

          <button class="mode-card" data-mode="animation">
            <div class="mode-icon bg-pink-50 text-pink-600">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#db2777" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
            <div class="mode-text">
              <span class="mode-title">Animation Only</span>
              <span class="mode-desc">CSS keyframes & trans.</span>
            </div>
          </button>

          <button class="mode-card" data-mode="asset">
            <div class="mode-icon bg-amber-50 text-amber-600">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </div>
            <div class="mode-text">
              <span class="mode-title">Image / SVG</span>
              <span class="mode-desc">Download assets</span>
            </div>
          </button>

          <button class="mode-card" data-mode="codepen">
            <div class="mode-icon bg-gray-100 text-gray-800">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l10 7.5 10-7.5-10-7.5z"/><path d="M12 12v7.5"/><path d="M2 12l10-7.5"/><path d="M22 12l-10-7.5"/></svg>
            </div>
            <div class="mode-text">
              <span class="mode-title">CodePen Export</span>
              <span class="mode-desc">Open live playground</span>
            </div>
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="recent-section">
        <div class="section-header">
          <span class="section-title">Recent Captures</span>
          <button class="text-btn" id="clear-history">Clear</button>
        </div>
        <div class="history-list" id="history-list">
          <div class="empty-state">No recent captures</div>
        </div>
      </div>
    </main>
    
    <!-- Settings View (Hidden by default) -->
    <div class="settings-view" id="settings-view">
      <div class="settings-header">
        <button class="icon-btn" id="back-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <span class="section-title">Settings</span>
      </div>
      <div class="settings-content">
        <label class="setting-item">
          <div class="setting-info">
            <span class="setting-name">Include HTML structure</span>
            <span class="setting-desc">For Component & Animation mode</span>
          </div>
          <input type="checkbox" id="setting-html" checked class="toggle-input">
          <div class="toggle-slider"></div>
        </label>
        <label class="setting-item">
          <div class="setting-info">
            <span class="setting-name">Format as React JSX</span>
            <span class="setting-desc">Change class to className</span>
          </div>
          <input type="checkbox" id="setting-jsx" class="toggle-input">
          <div class="toggle-slider"></div>
        </label>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
